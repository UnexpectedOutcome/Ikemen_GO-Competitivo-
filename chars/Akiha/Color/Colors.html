    <script type="text/javascript">//[!CDATA[
function hexFromRGB(r, g, b) {
    var hex = [r.toString(16), g.toString(16), b.toString(16)];
    $.each(hex, function(nr, val) {
        if (val.length == 1) {
            hex[nr] = '0' + val;
        }
      });
    return hex.join('').toUpperCase();
}

function refreshBGColor() {
    var red = $("#bgRed").slider("value");
    var green = $("#bgGreen").slider("value");
    var blue = $("#bgBlue").slider("value");
    $("body").css("background-color", "#" + hexFromRGB(red, green, blue));
}

$(document).ready(function() {
    // Initialize Color Selector
    $("#paletteNo").change(function() {
        var index = $(this).val() - 1;
        $(".akihaColors").css({
            'width' : '48px',
            'height' : '101px',
            'background-position' : "-" + Math.floor(index % 12) * 50 + "px" + " " + "-" + Math.floor(index / 12) * 101 + "px"
        });
        $(".necoColors").css({
            'width' : '28px',
            'height' : '25px',
            'background-position' : "-" + Math.floor(index % 12) * 30 + "px" + " " + ((index > 45) ? " -25px" : "0")
        });
    });
    $("#paletteNo").change();

    // Slider
    $("#bgRed, #bgGreen, #bgBlue").slider({
          orientation : 'horizontal',
          range : "min",
          max : 255,
          value : 127,
          slide: refreshBGColor,
          change: refreshBGColor
      }).each(function() {
          $(this).slider("value", 255);
      });;
});
//]]>
